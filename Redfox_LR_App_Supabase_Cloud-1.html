<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redfox Speed Parcel Service — LR App V3</title>
<style>
:root{--red:#d71920;--red2:#a90f15;--black:#0b0d10;--ink:#16181d;--muted:#6d737d;--bg:#f3f5f8;--card:#fff;--line:#e5e7eb;--green:#12834b;--amber:#b86b00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#08090b,#241014)}
.login-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 70px #0008}.logo{display:flex;align-items:center;gap:12px}.logo-mark{width:54px;height:54px;border-radius:15px;background:var(--red);display:grid;place-items:center;color:#fff;font-size:27px;font-weight:900}.logo h1{font-size:20px;margin:0}.logo small{color:var(--muted)}
.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;color:#555;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #d7192015}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.primary{background:var(--red);color:#fff}.dark{background:var(--black);color:#fff}.light{background:#f0f2f5;color:#20242a}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
.app-shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#090b0e;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 4px 20px;border-bottom:1px solid #ffffff16;margin-bottom:12px}.brand strong{font-size:18px}.nav button{width:100%;text-align:left;background:transparent;color:#cbd0d7;border:0;padding:11px 12px;border-radius:10px;margin:2px 0;font-weight:700}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:4}.main{min-width:0}.content{padding:22px;max-width:1500px;margin:auto}.top-actions{display:flex;gap:8px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(6,minmax(120px,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.stat b{display:block;font-size:25px;margin-top:7px}.muted{color:var(--muted);font-size:12px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}.section-title h2{font-size:19px;margin:0}.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.quick button{padding:15px 8px;background:#fff;border:1px solid var(--line);border-radius:13px;font-weight:800}.quick button:hover{border-color:var(--red);transform:translateY(-1px)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:#666;font-size:11px;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}.booked{background:#e9eefb;color:#3451a5}.transit{background:#fff1d7;color:#8a5500}.delivered{background:#dcfce7;color:#166534}.topay{background:#fee2e2;color:#991b1b}.paid{background:#dcfce7;color:#166534}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.timeline{display:flex;gap:0;overflow:auto;padding:18px 0}.step{min-width:130px;text-align:center;position:relative}.step:before{content:"";height:4px;background:#ddd;position:absolute;top:16px;left:50%;right:-50%}.step:last-child:before{display:none}.dot{width:34px;height:34px;border-radius:50%;background:#ddd;color:#777;margin:auto;display:grid;place-items:center;position:relative;z-index:1;font-weight:900}.step.done .dot{background:var(--red);color:#fff}.step.done:before{background:var(--red)}.step span{display:block;font-size:11px;font-weight:800;margin-top:8px}.pdf{max-width:850px;margin:auto;background:#fff;border:1px solid #ddd;padding:28px}.pdf-head{display:flex;justify-content:space-between;border-bottom:4px solid var(--red);padding-bottom:15px}.qr{width:95px;height:95px;border:1px dashed #aaa;display:grid;place-items:center;font-size:10px}.terms{background:#f7f7f7;padding:12px;font-size:11px}.sig{height:65px;border-bottom:1px solid #333}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:20}.mobile-nav{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.quick{grid-template-columns:repeat(3,1fr)}.app-shell{grid-template-columns:80px 1fr}.sidebar{padding:12px 8px}.brand strong,.brand small,.nav span{display:none}.nav button{text-align:center}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.app-shell{display:block}.sidebar{display:none}.top{height:62px;padding:0 13px}.content{padding:13px;padding-bottom:85px}.stats{grid-template-columns:repeat(2,1fr)}.two,.three,.form-grid{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding:7px 4px}.mobile-nav button{border:0;background:transparent;font-size:10px;font-weight:800}.mobile-nav button b{display:block;font-size:18px}.pdf{padding:16px}.top h2{font-size:16px}.top-actions .hide-mobile{display:none}}

/* REDFOX BRANDING V3 */
body{
  background:
    radial-gradient(circle at 12% 8%, rgba(215,25,32,.12), transparent 28%),
    radial-gradient(circle at 88% 92%, rgba(215,25,32,.09), transparent 30%),
    linear-gradient(135deg,#f7f7f8 0%,#eceef1 48%,#f8f8f9 100%);
}
.login{
  background:
    linear-gradient(rgba(5,6,8,.88),rgba(18,8,10,.92)),
    radial-gradient(circle at 50% 20%, rgba(215,25,32,.22), transparent 42%),
    #08090b;
  position:relative;
  overflow:hidden;
}
.login:before{
  content:"";position:absolute;inset:-20%;
  background:repeating-linear-gradient(135deg,transparent 0 45px,rgba(255,255,255,.025) 46px 47px);
  transform:rotate(-8deg);
}
.login-card{position:relative;z-index:1;border:1px solid #ffffff1f;background:rgba(255,255,255,.97)}
.login-brand-image{
  width:100%;max-width:270px;height:145px;object-fit:contain;
  display:block;margin:0 auto 16px;border-radius:12px;background:#fff;
}
.sidebar{
  background:
    radial-gradient(circle at 50% -10%, rgba(215,25,32,.22), transparent 34%),
    linear-gradient(180deg,#0a0b0d,#090a0c 55%,#12090b);
  border-right:1px solid #ffffff10;
}
.top{
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
}
.brand-logo{
  width:100%;height:64px;object-fit:contain;object-position:left center;
  background:#fff;border-radius:10px;padding:5px;margin-bottom:10px;
}

/* ===== REDFOX PREMIUM RED-BLACK GLASS UI ===== */
:root{
 --red:#ff1b24; --red2:#b3000b; --red3:#ff4a50;
 --black:#050608; --black2:#0b0d11; --panel:#11141a;
 --glass:rgba(255,255,255,.065); --glass2:rgba(255,255,255,.095);
 --line:rgba(255,255,255,.105); --ink:#f5f7fa; --muted:#a8afb9;
 --green:#26d982; --amber:#ffb52e; --shadow:0 22px 65px rgba(0,0,0,.38);
}
body{
 background:
 radial-gradient(circle at 8% 0%,rgba(255,27,36,.16),transparent 30%),
 radial-gradient(circle at 92% 8%,rgba(255,27,36,.10),transparent 28%),
 linear-gradient(135deg,#050608 0%,#0b0d11 48%,#090a0d 100%);
 color:var(--ink);
}
body:before{
 content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
 background:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
 background-size:42px 42px;
 mask-image:linear-gradient(to bottom,black,transparent 88%);
}
.login{
 background:
 radial-gradient(circle at 50% 28%,rgba(255,27,36,.22),transparent 35%),
 linear-gradient(145deg,#030405,#10080a 55%,#050608);
}
.login-card{
 background:rgba(15,17,22,.76)!important;
 border:1px solid rgba(255,255,255,.11);
 backdrop-filter:blur(24px) saturate(135%);
 -webkit-backdrop-filter:blur(24px) saturate(135%);
 box-shadow:0 35px 100px rgba(0,0,0,.62),0 0 0 1px rgba(255,27,36,.05);
 color:#fff;
}
.logo-mark{
 background:linear-gradient(145deg,#ff2028,#a80009)!important;
 box-shadow:0 10px 30px rgba(255,27,36,.25),inset 0 1px 0 rgba(255,255,255,.25);
 overflow:hidden;
}
.logo-image{background:#fff!important}
.logo-image img{width:100%;height:100%;object-fit:contain;display:block}
.logo h1{color:#fff}.logo small,.muted{color:#9fa7b2!important}
.field label{color:#b8bec7!important}
.field input,.field select,.field textarea{
 background:rgba(255,255,255,.055)!important;
 color:#fff!important;
 border:1px solid rgba(255,255,255,.11)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
.field input::placeholder,.field textarea::placeholder{color:#777f8b}
.field input:focus,.field select:focus,.field textarea:focus{
 border-color:rgba(255,27,36,.72)!important;
 box-shadow:0 0 0 3px rgba(255,27,36,.12),0 0 24px rgba(255,27,36,.10)!important;
}
.app-shell{grid-template-columns:260px 1fr}
.sidebar{
 background:rgba(5,6,8,.82)!important;
 border-right:1px solid rgba(255,255,255,.08);
 backdrop-filter:blur(22px);
 -webkit-backdrop-filter:blur(22px);
 box-shadow:18px 0 60px rgba(0,0,0,.25);
}
.brand{border-bottom-color:rgba(255,255,255,.09)!important}
.nav button{color:#aeb5bf!important;border:1px solid transparent}
.nav button.active{
 background:linear-gradient(90deg,rgba(255,27,36,.18),rgba(255,27,36,.04))!important;
 border-color:rgba(255,27,36,.22);
 color:#fff!important;
 box-shadow:inset 3px 0 0 var(--red),0 10px 30px rgba(0,0,0,.15);
}
.nav button:hover{background:rgba(255,255,255,.055)!important;color:#fff!important}
.top{
 background:rgba(8,10,13,.72)!important;
 color:#fff;
 border-bottom:1px solid rgba(255,255,255,.08)!important;
 backdrop-filter:blur(22px) saturate(130%);
 -webkit-backdrop-filter:blur(22px) saturate(130%);
}
.content{max-width:1550px}
.card{
 background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035))!important;
 border:1px solid rgba(255,255,255,.10)!important;
 box-shadow:var(--shadow);
 backdrop-filter:blur(18px) saturate(125%);
 -webkit-backdrop-filter:blur(18px) saturate(125%);
 color:#f4f6f8;
}
.card:hover{border-color:rgba(255,27,36,.20)!important}
.section-title h2,h2,h3{color:#fff}
.btn{
 border:1px solid rgba(255,255,255,.08)!important;
 transition:.18s ease;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.primary{
 background:linear-gradient(135deg,#ff2028,#c30f17)!important;
 box-shadow:0 10px 28px rgba(255,27,36,.20);
}
.dark{background:linear-gradient(135deg,#191c22,#0b0d11)!important;color:#fff!important}
.light{background:rgba(255,255,255,.065)!important;color:#eef1f5!important}
.danger{background:rgba(255,27,36,.13)!important;color:#ff8b90!important}
.success{background:rgba(38,217,130,.12)!important;color:#62e8a2!important}
.quick button{
 background:rgba(255,255,255,.055)!important;
 color:#f4f6f8;
 border-color:rgba(255,255,255,.09)!important;
 box-shadow:0 10px 28px rgba(0,0,0,.16);
}
.quick button:hover{border-color:rgba(255,27,36,.55)!important;background:rgba(255,27,36,.09)!important}
.table{color:#e9edf2}.table th{color:#8f98a4}.table td,.table th{border-bottom-color:rgba(255,255,255,.08)!important}
.badge.booked{background:rgba(88,125,255,.15);color:#9fb4ff}
.badge.transit{background:rgba(255,181,46,.14);color:#ffd174}
.badge.delivered{background:rgba(38,217,130,.13);color:#6ee9a7}
.badge.topay{background:rgba(255,27,36,.13);color:#ff9296}
.badge.paid{background:rgba(38,217,130,.13);color:#6ee9a7}
.timeline .dot{background:#252a32;color:#aeb5bf}
.timeline .step.done .dot{background:linear-gradient(135deg,#ff2028,#b3000b);color:#fff;box-shadow:0 0 0 5px rgba(255,27,36,.08),0 8px 22px rgba(255,27,36,.25)}
.timeline .step:before{background:#2b3038}.timeline .step.done:before{background:linear-gradient(90deg,#ff2028,#b3000b)}
.pdf{
 background:#fff!important;color:#111!important;border:0!important;
 border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.42);
}
.pdf .logo h1,.pdf h1,.pdf h3,.pdf b{color:#111}
.terms{background:#f5f5f5;color:#222}
.mobile-nav{
 background:rgba(8,10,13,.88)!important;
 border-top-color:rgba(255,255,255,.10)!important;
 backdrop-filter:blur(20px);
 -webkit-backdrop-filter:blur(20px);
}
.mobile-nav button{color:#aeb5bf}.mobile-nav button b{color:#fff}.mobile-nav button:hover{color:#ff5b61}
.avatar{background:linear-gradient(135deg,#ff2028,#a80009)!important;box-shadow:0 8px 22px rgba(255,27,36,.2)}
.toast{background:rgba(15,17,22,.92)!important;border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(18px);box-shadow:0 20px 50px #0008}
hr{border:0;border-top:1px solid rgba(0,0,0,.12)}
@media(max-width:680px){
 .top{background:rgba(8,10,13,.82)!important}
 .content{padding-top:16px}
 .card{border-radius:15px}
}


.chart-bars{height:190px;display:flex;align-items:flex-end;gap:12px;padding:15px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.bar-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:70%;min-height:8px;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,#ff343b,#a80009);box-shadow:0 8px 24px rgba(255,27,36,.2)}.bar-col small{color:#8f98a4;font-size:10px}
.rank{padding:9px 0}.rank span{float:right;color:#fff;font-weight:800;font-size:12px}.rankbar{height:5px;background:rgba(255,255,255,.07);border-radius:20px;margin-top:7px;overflow:hidden}.rankbar i{display:block;height:100%;background:linear-gradient(90deg,#ff2028,#ff5b61);border-radius:20px}
.glass-feature{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:16px}


body.light-mode{background:#eef1f5;color:#16181d}
body.light-mode .sidebar{background:#111318!important}
body.light-mode .top{background:rgba(255,255,255,.86)!important;color:#111}
body.light-mode .card{background:rgba(255,255,255,.82)!important;color:#16181d}
body.light-mode h2,body.light-mode h3,body.light-mode .section-title h2{color:#16181d}
body.light-mode .muted{color:#68717d!important}
body.light-mode .field input,body.light-mode .field select,body.light-mode .field textarea{background:#fff!important;color:#111!important;border-color:#d8dce2!important}
body.light-mode .quick button{background:#fff!important;color:#16181d}


/* REDFOX LR PRINT MODULE */
.print-stage{background:#20242a;border:1px solid #30343b;border-radius:18px;padding:22px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;min-height:680px}

async function loadCloudLRs(){if(!SUPABASE_ENABLED)return;try{const {data,error}=await supabaseClient.from('lrs').select('*').order('created_at',{ascending:false});if(error)throw error;state.lrs=(data||[]).map(rowToLR);save();toast('Cloud history loaded');}catch(e){console.error(e);toast('Cloud sync failed — check Supabase policies');}}
async function pushCloudLR(d){if(!SUPABASE_ENABLED)return true;const {error}=await supabaseClient.from('lrs').upsert(lrToRow(d),{onConflict:'lr_no'});if(error){console.error(error);toast('LR saved locally, cloud save failed');return false;}return true;}
async function deleteCloudLR(lr){if(!SUPABASE_ENABLED)return;const {error}=await supabaseClient.from('lrs').delete().eq('lr_no',lr);if(error)console.error(error);}
async function updateCloudLR(d){if(!SUPABASE_ENABLED)return;const {error}=await supabaseClient.from('lrs').update(lrToRow(d)).eq('lr_no',d.lr);if(error){console.error(error);toast('Cloud update failed');}}

function backup(){const stamp=new Date().toLocaleString();localStorage.setItem('redfox_last_backup',stamp);const blob=new Blob([JSON.stringify({version:'V3',branch:state.branch,lrs:state.lrs,audit:JSON.parse(localStorage.getItem('redfox_audit_v3')||'[]')},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='redfox-cloud-backup.json';a.click();toast('Cloud backup exported');show('cloud')}
function restore(){toast('Restore point selected — demo mode')}
function settings(c){c.innerHTML=`<div class="grid two"><div class="card"><h2>Company Settings</h2>${inp('company','Company Name','Redfox Speed Parcel Service')}${inp('phone','Contact','9788823004')}${inp('gst','GSTIN','')}${inp('lrprefix','LR Prefix','RF-')}<div class="field"><label>LANGUAGE</label><select id="langSelect" onchange="setLang(this.value)"><option>English</option><option>Tamil</option><option>Malayalam</option></select></div><div class="field"><label>THEME</label><select id="themeSelect" onchange="setTheme(this.value)"><option>Dark</option><option>Light</option></select></div><button class="btn primary" onclick="toast('Settings saved')">SAVE</button></div><div class="card"><h2>Security</h2><p>Role-based access: <b>Enabled</b></p><p>Activity logging: <b>Enabled</b></p><p>Cloud sync: <b>Enabled</b></p><button class="btn dark" onclick="toast('Security settings updated')">UPDATE SECURITY</button></div></div>`}
function notifications(c){
 const notes=[
 ['📦','LR booked','New LR has been created','BOOKED'],
 ['🚛','Vehicle dispatched','Trip has started','DISPATCHED'],
 ['📍','Parcel arrived','Shipment reached hub','ARRIVED'],
 ['🛵','Out for delivery','Parcel assigned for delivery','DELIVERY'],
 ['✅','Delivered','POD completed successfully','DELIVERED'],
 ['💰','Payment due','Customer payment is pending','PAYMENT'],
 ['📸','POD uploaded','Proof of delivery uploaded','POD']
 ];
 c.innerHTML=`<div class="card"><div class="section-title"><h2>🔔 Automatic Notifications</h2><button class="btn light" onclick="toast('All notifications marked read')">MARK ALL READ</button></div>
 ${notes.map((n,i)=>`<div class="glass-feature" style="margin:9px 0"><b style="font-size:14px">${n[0]} ${n[1]}</b><span style="float:right" class="badge ${i===5?'topay':'delivered'}">${i===5?'PAYMENT DUE':'ACTIVE'}</span><p class="muted" style="margin-bottom:0">${n[2]}</p></div>`).join('')}</div>`;
}


function setTheme(v){
 document.body.classList.toggle('light-mode',v==='Light');
 localStorage.setItem('redfox_theme',v);
 toast(v+' mode enabled');
}
function setLang(v){
 localStorage.setItem('redfox_lang',v);
 toast(v+' language selected');
}
function auditLog(action,module){
 const a=JSON.parse(localStorage.getItem('redfox_audit_v3')||'[]');
 a.unshift({time:new Date().toLocaleString(),user:state.user,action,module});
 localStorage.setItem('redfox_audit_v3',JSON.stringify(a.slice(0,300)));
}
const savedTheme=localStorage.getItem('redfox_theme');if(savedTheme==='Light')document.body.classList.add('light-mode');
const sess=sessionStorage.getItem('redfox_session');if(sess){Object.assign(state,JSON.parse(sess));document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('avatar').textContent=state.user[0].toUpperCase();buildNav();loadCloudLRs().then(()=>show('dashboard'))}
